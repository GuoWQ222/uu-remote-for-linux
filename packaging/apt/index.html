<h1>UU Remote for Linux APT Repository</h1>
<p>Ubuntu 24.04 Noble amd64 的签名软件源。</p>
<h2>X11</h2>
<pre>sudo apt install uu-remote-for-linux-x11</pre>
<p>不会替换 Mutter。</p>
<h2>GNOME Wayland</h2>
<pre>sudo apt install uu-remote-for-linux-wayland</pre>
<p>通过普通依赖关系，在同一 APT 事务中安装已验证的 Mutter 修复。安装后必须注销并重新登录 GNOME Wayland。</p>
<p><a href="apt/uu-remote-for-linux-archive-keyring.gpg">Archive public key</a></p>
