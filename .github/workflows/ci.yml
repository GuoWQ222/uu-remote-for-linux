name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream \
            binutils \
            desktop-file-utils \
            dpkg-dev \
            file \
            gcc-mingw-w64-x86-64 \
            gir1.2-appindicator3-0.1 \
            gir1.2-gtk-3.0 \
            libegl1 \
            libegl-dev \
            libgles2 \
            libgles-dev \
            libdrm-dev \
            libglib2.0-dev \
            libpipewire-0.3-0 \
            libpipewire-0.3-dev \
            libx11-6 \
            libxml2-utils \
            lintian \
            python3-gi \
            ripgrep \
            shellcheck \
            wine \
            xvfb

      - name: Run offline tests
        run: xvfb-run -a make test

      - name: Build direct release assets
        run: make release-assets

      - name: Inspect universal package and checksums
        run: |
          version=$(cat VERSION)
          package="dist/uu-remote-for-linux_${version}_amd64.deb"
          dpkg-deb --info "$package"
          test "$(dpkg-deb -f "$package" Package)" = uu-remote-for-linux
          dpkg-deb -f "$package" Depends | grep -Fq 'libxtst6'
          dpkg-deb -f "$package" Depends | grep -Fq 'xdg-desktop-portal-gnome'
          ! dpkg-deb -f "$package" Depends | grep -Eqi 'mutter|libmutter'
          test ! -e "dist/uu-remote-for-linux-x11_${version}_amd64.deb"
          test ! -e "dist/uu-remote-for-linux-wayland_${version}_amd64.deb"
          test ! -e "dist/uu-remote-for-linux-wayland_${version}_amd64.zip"
          stage=$(mktemp -d)
          dpkg-deb -x "$package" "$stage"
          test -x "$stage/usr/bin/uu-remote-for-linux"
          test -x "$stage/usr/lib/uu-remote-for-linux/uu-remote-pipewire-capture"
          test -z "$(find "$stage" -type f -iname '*mutter*' -o -iname '*keyring*')"
          dpkg-deb --contents "$package" > dist/CONTENTS.txt
          (cd dist && sha256sum --strict -c SHA256SUMS)

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: uu-remote-for-linux-direct-downloads
          path: |
            dist/uu-remote-for-linux_*_amd64.deb
            dist/SHA256SUMS
            dist/CONTENTS.txt
          if-no-files-found: error
