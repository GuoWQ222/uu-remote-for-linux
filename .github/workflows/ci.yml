name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream \
            binutils \
            desktop-file-utils \
            dpkg-dev \
            file \
            gir1.2-appindicator3-0.1 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gtk-3.0 \
            gstreamer1.0-plugins-base \
            libglib2.0-dev \
            libpipewire-0.3-0 \
            libx11-6 \
            libxml2-utils \
            python3-gi \
            ripgrep \
            shellcheck \
            unzip \
            zip \
            xvfb

      - name: Run offline tests
        run: xvfb-run -a make test

      - name: Verify embedded Mutter binary and source bundle
        run: make mutter-bundle

      - name: Build direct release assets
        run: make release-assets

      - name: Inspect packaged repair and create checksums
        run: |
          version=$(cat VERSION)
          x11_package="dist/uu-remote-for-linux-x11_${version}_amd64.deb"
          wayland_archive="dist/uu-remote-for-linux-wayland_${version}_amd64.zip"
          dpkg-deb --info "$x11_package"
          test "$(dpkg-deb -f "$x11_package" Package)" = \
            uu-remote-for-linux-x11
          ! dpkg-deb -f "$x11_package" Depends | \
            grep -Fq 'uu-remote-for-linux (= '
          stage=$(mktemp -d)
          unzip -q "$wayland_archive" -d "$stage"
          bundle="$stage/uu-remote-for-linux-wayland_${version}_amd64"
          test "$(find "$bundle" -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 6
          (
            cd "$bundle"
            sha256sum --strict -c SHA256SUMS
          )
          wayland_package="$bundle/uu-remote-for-linux-wayland_${version}_amd64.deb"
          test "$(dpkg-deb -f "$wayland_package" Package)" = \
            uu-remote-for-linux-wayland
          dpkg-deb -f "$wayland_package" Depends | \
            grep -Fq 'libmutter-14-0 (>= 46.2-1ubuntu0.24.04.16+0uuremote3)'
          test ! -e "$bundle/uu-remote-for-linux-archive-keyring_${version}_all.deb"
          dpkg-deb --contents "$x11_package" > dist/CONTENTS.txt
          (cd dist && sha256sum --strict -c SHA256SUMS)

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: uu-remote-for-linux-direct-downloads
          path: |
            dist/uu-remote-for-linux-x11_*_amd64.deb
            dist/uu-remote-for-linux-wayland_*_amd64.zip
            dist/SHA256SUMS
            dist/CONTENTS.txt
          if-no-files-found: error
