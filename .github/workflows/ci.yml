name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream \
            binutils \
            desktop-file-utils \
            file \
            libxml2-utils \
            shellcheck

      - name: Run offline tests
        run: make test

      - name: Build Debian package
        run: make deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: uuyc-linux-controller-deb
          path: dist/uuyc-linux-controller_*_amd64.deb
          if-no-files-found: error
